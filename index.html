<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Place Search — Mapy.com</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="container">
    <h1>Place Search</h1>
    <p class="subtitle">Search for a place and open it on Mapy.com</p>

    <form id="search-form" autocomplete="off">
      <input
        id="search-input"
        type="text"
        placeholder="Enter a place name, e.g. Prague"
        aria-label="Place name"
      />
      <button id="search-button" type="submit">Search</button>
    </form>

    <div id="status" class="status" role="status" hidden></div>
    <ul id="results" class="results" hidden></ul>
  </main>

  <script src="app.js"></script>
</body>
</html>
